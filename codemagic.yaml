workflows:
  ios-app-store:
    name: Nanawax VIP (cliente) — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Nanawax App Store Connect  # nom de la clé API à créer dans Codemagic > Settings > Integrations

    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.nanawax.vip"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.17.0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Add iOS platform (si absente)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Générer l'icône de l'app (logo Nanawax)
        script: |
          set -e
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#160800' --iconBackgroundColorDark '#160800'

      - name: Restreindre l'app à iPhone uniquement (pas d'iPad)
        script: |
          set -e
          sed -i '' "s/TARGETED_DEVICE_FAMILY = \"1,2\";/TARGETED_DEVICE_FAMILY = 1;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/TARGETED_DEVICE_FAMILY = \"1,2\"/TARGETED_DEVICE_FAMILY = 1/g" ios/App/App.xcodeproj/project.pbxproj
          echo "--- vérification ---"
          grep -n "TARGETED_DEVICE_FAMILY" ios/App/App.xcodeproj/project.pbxproj

      - name: Déclarer l'app exempte de chiffrement non standard
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "--- vérification ---"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"

      - name: Cible iOS minimale 15.0 (ITMS-90068)
        script: |
          set -e
          MIN="15.0"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = $MIN;/g" ios/App/App.xcodeproj/project.pbxproj
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/^platform :ios, .*/platform :ios, '$MIN'/" ios/App/Podfile
          fi
          if [ -f ios/App/CapApp-SPM/Package.swift ]; then
            sed -i '' "s/\.iOS(\.v[0-9]*)/.iOS(.v15)/" ios/App/CapApp-SPM/Package.swift
          fi
          echo "--- vérification ---"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          if [ -f ios/App/Podfile ]; then grep -n "^platform :ios" ios/App/Podfile; fi
          if grep -q "IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\." ios/App/App.xcodeproj/project.pbxproj; then
            echo "Une cible < 15.0 subsiste dans project.pbxproj" >&2
            exit 1
          fi

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Debug env vars (sans afficher leur contenu)
        script: |
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then echo "CERTIFICATE_PRIVATE_KEY: SET (${#CERTIFICATE_PRIVATE_KEY} caracteres)"; else echo "CERTIFICATE_PRIVATE_KEY: EMPTY"; fi
          if [ -n "$APP_STORE_APPLE_ID" ]; then echo "APP_STORE_APPLE_ID: SET ($APP_STORE_APPLE_ID)"; else echo "APP_STORE_APPLE_ID: EMPTY"; fi
          if [ -n "$BUNDLE_ID" ]; then echo "BUNDLE_ID: SET ($BUNDLE_ID)"; else echo "BUNDLE_ID: EMPTY"; fi

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID") + 1))
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Créer le schéma partagé App
        script: |
          set -e
          PROJ="ios/App/App.xcodeproj"
          SCHEME_DIR="$PROJ/xcshareddata/xcschemes"
          if [ -f "$SCHEME_DIR/App.xcscheme" ]; then
            echo "Schéma partagé déjà présent."
            exit 0
          fi
          BP=$(awk '/Begin PBXNativeTarget section/,/End PBXNativeTarget section/' "$PROJ/project.pbxproj" | grep -m1 -E '[0-9A-F]{24} /\* App \*/ = \{' | awk '{print $1}')
          BP=${BP:-504EC3031FED79650016851F}
          echo "BlueprintIdentifier de la cible App : $BP"
          mkdir -p "$SCHEME_DIR"
          cat > "$SCHEME_DIR/App.xcscheme" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BP" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES">
                <Testables></Testables>
             </TestAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BP" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BP" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>
          </Scheme>
          XML
          xcodebuild -project "$PROJ" -list || true

      - name: Build iOS (archive)
        script: |
          set -e
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
