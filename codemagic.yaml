workflows:
  ios-app-store:
    name: Nanawax VIP (cliente) — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Nanawax App Store Connect  # nom de la clé API à créer dans Codemagic > Settings > Integrations

    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.nanawax.vip"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace" 
        XCODE_SCHEME: "App"
      node: 20.17.0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Add iOS platform (si absente)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Debug env vars (sans afficher leur contenu)
        script: |
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then echo "CERTIFICATE_PRIVATE_KEY: SET (${#CERTIFICATE_PRIVATE_KEY} caracteres)"; else echo "CERTIFICATE_PRIVATE_KEY: EMPTY"; fi
          if [ -n "$APP_STORE_APPLE_ID" ]; then echo "APP_STORE_APPLE_ID: SET ($APP_STORE_APPLE_ID)"; else echo "APP_STORE_APPLE_ID: EMPTY"; fi
          if [ -n "$BUNDLE_ID" ]; then echo "BUNDLE_ID: SET ($BUNDLE_ID)"; else echo "BUNDLE_ID: EMPTY"; fi

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID") + 1))
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS (archive)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE"
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
